components:
  schemas:
    ErrorEnvelope:
      properties:
        errcode:
          description: 错误码
          type: number
        errmsg:
          description: 错误信息
          type: string
      type: object
    GetCgiBinCustomserviceGetkflistRequest:
      type: object
    GetCgiBinCustomserviceGetkflistResponse:
      properties:
        kf_list:
          description: 客服列表
          items:
            properties:
              invite_expire_time:
                description: 如果客服账号尚未绑定微信号,但是已经发起过一个绑定邀请, 邀请的过期时间,为unix 时间戳
                type: string
              invite_status:
                description: 邀请的状态,有等待确认"waiting",被拒绝"rejected", 过期"expired"
                type: string
              invite_wx:
                description: 如果客服账号尚未绑定微信号,但是已经发起了一个绑定邀请, 则此处显示绑定邀请的微信号
                type: string
              kf_account:
                description: 完整客服账号,格式为:账号前缀@公众号微信号
                type: string
              kf_headimgurl:
                description: 客服头像
                type: string
              kf_id:
                description: 客服编号
                type: string
              kf_nick:
                description: 客服昵称
                type: string
              kf_openid:
                description: 客服openid
                type: string
              kf_wx:
                description: 如果客服账号已绑定了客服人员微信号, 则此处显示微信号
                type: string
            type: object
          type: array
      type: object
    GetCgiBinCustomserviceGetonlinekflistRequest:
      type: object
    GetCgiBinCustomserviceGetonlinekflistResponse:
      properties:
        kf_online_list:
          description: 在线客服列表
          items:
            properties:
              accepted_case:
                description: 客服当前正在接待的会话数
                format: int64
                type: integer
              kf_account:
                description: 完整客服账号,格式为:账号前缀@公众号微信号
                type: string
              kf_id:
                description: 客服编号
                format: int64
                type: integer
              kf_openid:
                description: 客服openid
                type: string
              status:
                description: 客服在线状态,目前为:0-不在线,1-web 在线
                format: int64
                type: integer
            type: object
          type: array
      type: object
    GetCgiBinDraftCountRequest:
      type: object
    GetCgiBinDraftCountResponse:
      properties:
        total_count:
          description: 草稿的总数
          format: int64
          type: integer
      type: object
    GetCgiBinGetApiDomainIpRequest:
      type: object
    GetCgiBinGetApiDomainIpResponse:
      properties:
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误信息
          type: string
        ip_list:
          description: 微信服务器IP地址列表
          items:
            type: string
          type: array
      type: object
    GetCgiBinGetCurrentAutoreplyInfoRequest:
      type: object
    GetCgiBinGetCurrentAutoreplyInfoResponse:
      properties:
        add_friend_autoreply_info:
          description: 关注后自动回复的信息
          properties:
            content:
              description: 对于文本类型,content是文本内容,对于图文、图片、语音、视频类型,content是mediaID
              type: string
            type:
              description: 自动回复的类型。关注后自动回复和消息自动回复的类型仅支持文本(text)、图片(img)、语音(voice)、视频(video),关键词自动回复则还多了图文消息(news)
              type: string
          type: object
        is_add_friend_reply_open:
          description: 关注后自动回复是否开启(0-未开启 1-开启)
          format: int64
          type: integer
        is_autoreply_open:
          description: 消息自动回复是否开启(0-未开启 1-开启)
          format: int64
          type: integer
        keyword_autoreply_info:
          description: 关键词自动回复的信息
          properties:
            list:
              description: 自动回复列表
              items:
                properties:
                  create_time:
                    description: 创建时间
                    format: int64
                    type: integer
                  keyword_list_info:
                    description: 匹配的关键词列表
                    items:
                      type: string
                    type: array
                  reply_list_info:
                    description: 回复列表
                    items:
                      type: string
                    type: array
                  reply_mode:
                    description: 回复模式,reply_all代表全部回复,random_one代表随机回复其中一条
                    type: string
                  rule_name:
                    description: 规则名称
                    type: string
                type: object
              type: array
          type: object
        message_default_autoreply_info:
          description: 消息自动回复的信息
          properties:
            content:
              description: 对于文本类型,content是文本内容,对于图文、图片、语音、视频类型,content是mediaID
              type: string
            type:
              description: 自动回复的类型。关注后自动回复和消息自动回复的类型仅支持文本(text)、图片(img)、语音(voice)、视频(video),关键词自动回复则还多了图文消息(news)
              type: string
          type: object
      type: object
    GetCgiBinGetCurrentSelfmenuInfoRequest:
      type: object
    GetCgiBinGetCurrentSelfmenuInfoResponse:
      properties:
        is_menu_open:
          description: 菜单是否开启,0代表未开启,1代表开启
          format: int64
          type: integer
        selfmenu_info:
          description: 菜单信息
          properties:
            button:
              description: 菜单按钮
              items:
                properties:
                  key:
                    description: '对于不同的菜单类型,value的值意义不同。官网上设置的自定义菜单: Text:保存文字到value;
                      Img、voice:保存mediaID到value; Video:保存视频下载链接到value; News:保存图文消息到news_info,同时保存mediaID到value;
                      View:保存链接到url。 使用API设置的自定义菜单: click、scancode_push、scancode_waitmsg、pic_sysphoto、pic_photo_or_album、
                      pic_weixin、location_select:保存值到key;view:保存链接到url'
                    type: string
                  name:
                    description: 菜单名称
                    type: string
                  news_info:
                    description: 图文消息的信息
                    type: object
                  type:
                    description: 菜单的类型,具体参考新增 API 的描述
                    type: string
                  url:
                    description: '对于不同的菜单类型,value的值意义不同。官网上设置的自定义菜单: Text:保存文字到value;
                      Img、voice:保存mediaID到value; Video:保存视频下载链接到value; News:保存图文消息到news_info,同时保存mediaID到value;
                      View:保存链接到url。 使用API设置的自定义菜单: click、scancode_push、scancode_waitmsg、pic_sysphoto、pic_photo_or_album、
                      pic_weixin、location_select:保存值到key;view:保存链接到url'
                    type: string
                  value:
                    description: '对于不同的菜单类型,value的值意义不同。官网上设置的自定义菜单: Text:保存文字到value;
                      Img、voice:保存mediaID到value; Video:保存视频下载链接到value; News:保存图文消息到news_info,同时保存mediaID到value;
                      View:保存链接到url。 使用API设置的自定义菜单: click、scancode_push、scancode_waitmsg、pic_sysphoto、pic_photo_or_album、
                      pic_weixin、location_select:保存值到key;view:保存链接到url'
                    type: string
                type: object
              type: array
          type: object
      type: object
    GetCgiBinGetcallbackipRequest:
      type: object
    GetCgiBinGetcallbackipResponse:
      properties:
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误信息
          type: string
        ip_list:
          description: 微信服务器IP地址列表
          items:
            type: string
          type: array
      type: object
    GetCgiBinMaterialGetMaterialcountRequest:
      type: object
    GetCgiBinMediaGetJssdkRequest:
      type: object
    GetCgiBinMediaGetRequest:
      type: object
    GetCgiBinMenuDeleteRequest:
      type: object
    GetCgiBinMenuDeleteResponse:
      properties:
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误信息
          type: string
      type: object
    GetCgiBinMenuGetRequest:
      type: object
    GetCgiBinMenuGetResponse:
      properties:
        conditionalmenu:
          description: 个性化菜单列表
          items:
            properties:
              button:
                description: 一级菜单数组(1-3个)
                items:
                  type: string
                type: array
              matchrule:
                description: 菜单匹配规则(至少一个非空字段)
                type: object
            type: object
          type: array
        menu:
          description: 默认菜单信息
          properties:
            button:
              description: 一级菜单数组(1-3个)
              items:
                properties:
                  appid:
                    description: 小程序的appid(仅认证公众号可配置),miniprogram类型必须
                    type: string
                  article_id:
                    description: 发布后获得的合法 article_id,article_id类型和article_view_limited类型必须
                    type: string
                  key:
                    description: 菜单KEY值,用于消息接口推送,不超过128字节。click等点击类型必须。
                    type: string
                  media_id:
                    description: 调用新增永久素材接口返回的合法media_id。media_id类型和view_limited类型必须
                    type: string
                  name:
                    description: 菜单标题,不超过16个字节,子菜单不超过60个字节
                    type: string
                  pagepath:
                    description: 小程序的页面路径,miniprogram类型必须
                    type: string
                  sub_button:
                    description: 二级菜单结构体数组
                    items:
                      type: string
                    type: array
                  type:
                    description: 菜单的响应动作类型(与 sub_button 互斥)
                    type: string
                  url:
                    description: 网页链接,用户点击菜单可打开链接,不超过1024字节。 type为miniprogram时,不支持小程序的老版本客户端将打开本url。view、miniprogram类型必填。
                    type: string
                type: object
              type: array
          type: object
      type: object
    GetCgiBinTagsGetRequest:
      type: object
    GetCgiBinTagsGetResponse:
      properties:
        tags:
          description: 标签列表
          items:
            properties:
              count:
                description: 标签下粉丝数
                format: int64
                type: integer
              id:
                description: 标签id,由微信分配
                format: int64
                type: integer
              name:
                description: 标签名,UTF8编码
                type: string
            type: object
          type: array
      type: object
    GetCgiBinTemplateGetAllPrivateTemplateRequest:
      type: object
    GetCgiBinTemplateGetAllPrivateTemplateResponse:
      properties:
        template_list:
          description: 模版列表
          items:
            properties:
              content:
                description: 模板内容
                type: string
              deputy_industry:
                description: 模板所属行业的二级行业
                type: string
              example:
                description: 模板示例
                type: string
              primary_industry:
                description: 模板所属行业的一级行业
                type: string
              template_id:
                description: 模板ID
                type: string
              title:
                description: 模板标题
                type: string
            type: object
          type: array
      type: object
    GetCgiBinTemplateGetIndustryRequest:
      type: object
    GetCgiBinTemplateGetIndustryResponse:
      properties:
        primary_industry:
          description: 账号设置的主营行业
          properties:
            first_class:
              description: 一级类目
              type: string
            second_class:
              description: 二级类目
              type: string
          type: object
        secondary_industry:
          description: 账号设置的副营行业
          properties:
            first_class:
              description: 一级类目
              type: string
            second_class:
              description: 二级类目
              type: string
          type: object
      type: object
    GetCgiBinTicketGetticketRequest:
      type: object
    GetCgiBinTicketGetticketResponse:
      properties:
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误信息
          type: string
        expires_in:
          description: 有效期(秒)
          format: int64
          type: integer
        ticket:
          description: 临时票据
          type: string
      type: object
    GetCgiBinTokenRequest:
      type: object
    GetCgiBinTokenResponse:
      properties:
        access_token:
          description: 获取到的凭证
          type: string
        expires_in:
          description: 凭证有效时间,单位:秒。目前是7200秒之内的值。
          format: int64
          type: integer
      type: object
    GetCgiBinUserGetRequest:
      type: object
    GetCgiBinUserGetResponse:
      properties:
        count:
          description: 拉取的OPENID个数,最大值为10000
          format: int64
          type: integer
        data:
          description: 列表数据,OPENID的列表
          properties:
            openid:
              description: 用户唯一ID
              items:
                type: string
              type: array
          type: object
        next_openid:
          description: 拉取列表后一个用户的OPENID
          type: string
        total:
          description: 关注该公众账号的总用户数
          format: int64
          type: integer
      type: object
    GetCgiBinUserInfoRequest:
      type: object
    GetCgiBinUserInfoResponse:
      properties:
        groupid:
          description: 用户所在的分组ID(兼容旧的用户分组接口)
          format: int64
          type: integer
        language:
          description: 【注意:该字段不再提供】用户的语言,简体中文为zh_CN
          type: string
        openid:
          description: 用户的标识,对当前公众号唯一
          type: string
        qr_scene:
          description: 二维码扫码场景(开发者自定义)
          format: int64
          type: integer
        qr_scene_str:
          description: 二维码扫码场景描述(开发者自定义)
          type: string
        remark:
          description: 公众号运营者对粉丝的备注,公众号运营者可在微信公众平台用户管理界面对粉丝添加备注
          type: string
        subscribe:
          description: 用户是否订阅该公众号标识,值为0时,代表此用户没有关注该公众号,拉取不到其余信息。
          format: int64
          type: integer
        subscribe_scene:
          description: 返回用户关注的渠道来源,ADD_SCENE_SEARCH 公众号搜索,ADD_SCENE_ACCOUNT_MIGRATION
            公众号迁移,ADD_SCENE_PROFILE_CARD 名片分享,ADD_SCENE_QR_CODE 扫描二维码,ADD_SCENE_PROFILE_LINK
            图文页内名称点击,ADD_SCENE_PROFILE_ITEM 图文页右上角菜单,ADD_SCENE_PAID 支付后关注,ADD_SCENE_WECHAT_ADVERTISEMENT
            微信广告,ADD_SCENE_REPRINT 他人转载,ADD_SCENE_LIVESTREAM 视频号直播,ADD_SCENE_CHANNELS
            视频号,ADD_SCENE_WXA 小程序关注,ADD_SCENE_OTHERS 其他
          type: string
        subscribe_time:
          description: 用户关注时间,为时间戳。如果用户曾多次关注,则取最后关注时间
          type: string
        tagid_list:
          description: 用户被打上的标签ID列表
          items:
            type: string
          type: array
        unionid:
          description: 只有在用户将公众号绑定到微信开放平台账号后,才会出现该字段。
          type: string
      type: object
    GetCustomserviceKfsessionGetsessionRequest:
      type: object
    GetCustomserviceKfsessionGetsessionResponse:
      properties:
        createtime:
          description: 会话接入时间
          type: string
        kf_account:
          description: 接待客服账号
          type: string
      type: object
    GetCustomserviceKfsessionGetsessionlistRequest:
      type: object
    GetCustomserviceKfsessionGetsessionlistResponse:
      properties:
        sessionlist:
          description: 会话列表
          items:
            properties:
              createtime:
                description: 会话接入时间
                type: string
              openid:
                description: 用户openid
                type: string
            type: object
          type: array
      type: object
    GetCustomserviceKfsessionGetwaitcaseRequest:
      type: object
    GetCustomserviceKfsessionGetwaitcaseResponse:
      properties:
        count:
          description: 未接入会话数量
          format: int64
          type: integer
        waitcaselist:
          description: 未接入会话列表,最多返回100条数据,按照来访顺序
          items:
            properties:
              latest_time:
                description: 用户的最后一条消息的时间
                format: int64
                type: integer
              openid:
                description: 用户openid
                type: string
            type: object
          type: array
      type: object
    GetSnsAuthRequest:
      type: object
    GetSnsAuthResponse:
      properties:
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误描述
          type: string
      type: object
    GetSnsOauth2AccessTokenRequest:
      type: object
    GetSnsOauth2AccessTokenResponse:
      properties:
        access_token:
          description: 网页授权接口调用凭证,注意:此access_token与基础支持的access_token不同
          type: string
        expires_in:
          description: access_token接口调用凭证超时时间,单位(秒)
          format: int64
          type: integer
        is_snapshotuser:
          description: 是否为快照页模式虚拟账号,只有当用户是快照页模式虚拟账号时返回,值为1
          format: int64
          type: integer
        openid:
          description: 用户唯一标识,请注意,在未关注公众号时,用户访问公众号的网页,也会产生一个用户和公众号唯一的OpenID
          type: string
        refresh_token:
          description: 用户刷新access_token
          type: string
        unionid:
          description: 用户统一标识(针对一个微信开放平台账号下的应用,同一用户的 unionid 是唯一的),只有当scope为"snsapi_userinfo"时返回
          type: string
      type: object
    GetSnsOauth2RefreshTokenRequest:
      type: object
    GetSnsOauth2RefreshTokenResponse:
      properties:
        access_token:
          description: 网页授权接口调用凭证,注意:此access_token与基础支持的access_token不同
          type: string
        expires_in:
          description: access_token接口调用凭证超时时间,单位(秒)
          format: int64
          type: integer
        openid:
          description: 用户唯一标识
          type: string
        refresh_token:
          description: 用户刷新access_token
          type: string
        scope:
          description: 用户授权的作用域,使用逗号(,)分隔
          type: string
      type: object
    GetSnsUserinfoRequest:
      type: object
    GetSnsUserinfoResponse:
      properties:
        city:
          description: 普通用户个人资料填写的城市
          type: string
        country:
          description: 国家,如中国为CN
          type: string
        headimgurl:
          description: 用户头像,最后一个数值代表正方形头像大小(有0、46、64、96、132数值可选,0代表640*640正方形头像),用户没有头像时该项为空。若用户更换头像,原有头像URL将失效。
          type: string
        nickname:
          description: 用户昵称
          type: string
        openid:
          description: 用户的唯一标识
          type: string
        privilege:
          description: 用户特权信息,json 数组,如微信沃卡用户为(chinaunicom)
          items:
            type: string
          type: array
        province:
          description: 用户个人资料填写的省份
          type: string
        sex:
          description: 用户的性别,值为1时是男性,值为2时是女性,值为0时是未知
          format: int64
          type: integer
        unionid:
          description: 只有在管理员将公众号绑定到微信开放平台账号后,才会出现该字段。
          type: string
      type: object
    GetWxaGetDistrictRequest:
      type: object
    GetWxaGetDistrictResponse:
      properties:
        data_version:
          description: 数据版本
          type: string
        message:
          description: 状态描述
          type: string
        result:
          description: 数据内容,此数组是二维数组,分别代表省市区的信息
          items:
            properties:
              cidx:
                description: 下属地区所有id,可通过此id获取下属地区
                items:
                  type: string
                type: array
              fullname:
                description: 省市区完整名称
                type: string
              id:
                description: 区域id,也叫做 districtid
                type: string
              location:
                description: 坐标
                type: object
              name:
                description: 省市区简要名称
                type: string
              pinyin:
                description: 省市区拼音列表
                items:
                  type: string
                type: array
            type: object
          type: array
        status:
          description: 状态码
          format: int64
          type: integer
      type: object
    GetWxaGetMerchantAuditInfoRequest:
      properties:
        audit_id:
          description: 审核单id
          format: int64
          type: integer
      required:
      - audit_id
      type: object
    GetWxaGetMerchantAuditInfoResponse:
      properties:
        data:
          description: 审核结果
          properties:
            audit_id:
              description: 审核单id
              format: int64
              type: integer
            reason:
              description: 审核状态为3或者4时,reason列出审核失败的原因
              format: int64
              type: integer
            status:
              description: 审核状态,0:未提交审核,1:审核成功,2:审核中,3:审核失败,4:管理员拒绝
              format: int64
              type: integer
          type: object
        errcode:
          description: 错误码
          format: int64
          type: integer
        errmsg:
          description: 错误描述
          type: string
      type: object
    GetWxaGetMerchantCategoryRequest:
      type: object
    GetWxaGetMerchantCategoryResponse:
      properties:
        data:
          description: 数据
          properties:
