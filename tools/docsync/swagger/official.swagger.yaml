                适用范围:供状态/方式/类型/提醒/说明/详情关键词选择(如:支付状态、排队状态、天气状态、物流状态、用药提醒、还款提醒)
              type: string
            phone_number.DATA:
              description: 电话号码,17位以内,数字、符号,例:+86-0766-66888866 适用范围:供电话号码类关键词选择
              type: string
            thing.DATA:
              description: 事物,可汉字、数字、字母或符号组合,1-20个字符。(即,thing1.value的值最多 20 个字符,thing2.value的值最多
                20 个字符,如此类推) 符号包含了所有可见的正常符号,特殊不可见的符号则不可以。 适用范围:供姓名关键词、地址关键词、机构/组织名关键词选择(如:单位名、银行名、医院名、科室、班级)、品名关键词选择(如:药品名、股票名、课程名、科目名、岗位名)
              type: string
            time.DATA:
              description: 时间,24小时制时间格式(支持+年月日),支持HH:MM:SS或者HH:MM,支持填时间段,两个时间点之间用"~"符号连接,例如:「15:01」或「2019年10月1日
                15:01」 适用范围:供时间类关键词选择
              type: string
          type: object
        miniprogram:
          description: 跳转小程序时填写(url 和 miniprogram 同时不填,无跳转,page 和 miniprogram 同时填写,优先跳转小程序)
