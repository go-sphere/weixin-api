info:
  description: Extracted from the official WeChat documentation by docsync. Do not
    edit; regenerate with make docs-sync.
  title: WeChat Official/Service Account Server APIs
  version: 1.0.0
openapi: 3.0.3
paths:
  /card/invoice/biz/getselecttitleurl:
    post:
      description: 'Doc: https://developers.weixin.qq.com/doc/service/api/invoice/name/api_invoicebizgetselecttitleurl.html'
      operationId: PostCardInvoiceBizGetselecttitleurl
      parameters:
      - description: 接口调用凭证,可使用 access_token 、 authorizer_access_token
        in: query
        name: access_token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCardInvoiceBizGetselecttitleurlRequest'
        description: 请求体
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCardInvoiceBizGetselecttitleurlResponse'
          description: 获取商户专属抬头链接
      summary: 获取商户专属抬头链接
      x-error-codes:
      - code: "40001"
        description: invalid credential access_token isinvalid or not latest
        solution: access_token 无效或不为最新获取的 access_token,请开发者确认access_token的有效性
  /card/invoice/biz/getusertitleurl:
    post:
      description: 'Doc: https://developers.weixin.qq.com/doc/service/api/invoice/name/api_invoicebizgetusertitleurl.html'
      operationId: PostCardInvoiceBizGetusertitleurl
      parameters:
      - description: 接口调用凭证,可使用 access_token 、 authorizer_access_token
        in: query
        name: access_token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCardInvoiceBizGetusertitleurlRequest'
        description: 请求体
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCardInvoiceBizGetusertitleurlResponse'
          description: 录入抬头到用户微信
      summary: 录入抬头到用户微信
      x-error-codes:
      - code: "40001"
        description: invalid credential
        solution: 不合法的凭证类型
  /card/invoice/getauthdata:
    post:
      description: 'Doc: https://developers.weixin.qq.com/doc/service/api/invoice/FiscalReceipt/api_invoicebizgetauthdata.html'
      operationId: PostCardInvoiceGetauthdata
      parameters:
      - description: 接口调用凭证,可使用 access_token 、 authorizer_access_token
        in: query
        name: access_token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCardInvoiceGetauthdataRequest'
        description: 请求体
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCardInvoiceGetauthdataResponse'
          description: 查询授权信息
      summary: 查询授权信息
      x-error-codes:
      - code: "40078"
        description: invalid card status
        solution: card_id 未授权。 若开发者使用沙箱环境报此错误,主要因为未将调用接口的微信添加到测试把名单; 若开发者使用正式环境报此错误,主要原因可能为:调用接口公众号未开通卡券权限,或创建
          card_id 与插卡时间间隔过短。
      - code: "72015"
        description: unauthorized create invoice
        solution: 没有操作权限,请检查是否已开通相应权限。
      - code: "72031"
        description: invalid params
        solution: 参数错误。可能为请求中包括无效的参数名称或包含不通过后台校验的参数值
      - code: "72035"
        description: biz reject insert
        solution: 财政电子票据已经被拒绝领取。若 order_id 被用作参数调用过拒绝领取接口,再使用此 order_id 插卡机会报此错误
      - code: "72036"
        description: invoice is busy
        solution: 财政电子票据正在被修改状态,请稍后再试
      - code: "72038"
        description: invoice order never auth
        solution: 订单没有授权,可能是财政局的s_pappid 、执收单位 appid 、订单 order_id 不匹配
      - code: "72040"
        description: invoice pdf error
        solution: Pdf 无效,请提供真实有效的 pdf
      - code: "72042"
        description: billing_code and billing_no repeated
        solution: 票据号码和票据代码重复
      - code: "72043"
        description: billing_code or billing_no size error
        solution: 票据号码和票据代码错误
  /card/invoice/getauthurl:
    post:
      description: 'Doc: https://developers.weixin.qq.com/doc/service/api/invoice/auth/api_invoicebizgetauthurl.html'
