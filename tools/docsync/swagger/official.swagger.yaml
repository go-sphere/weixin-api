              type: string
            car_number.DATA:
              description: 车牌号码,8位以内,第一位与最后一位可为汉字,其余为字母或数字,如:粤A8Z888挂 适用范围:供车牌号码类关键词选择
              type: string
            character_string.DATA:
              description: 字符串,可数字、字母或符号组合,32位以内数字、字母或符号 适用范围:供数字/编码/编号/单号/卡号/航班号关键词选择(如:证券编码、设备编号、快递单号、银行卡号、网址)
              type: string
            const.DATA:
