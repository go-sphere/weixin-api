name: Test

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # Library module: tidy check, lint and unit tests.
      - name: Library check
        run: make test

      # docsync is a separate module, and its parity suite is the wire-level
      # safety net for the generated clients; neither runs under `go test ./...`
      # of the library module, so they are invoked explicitly. Without this the
      # generated client regressions would never be caught in CI.
      - name: Generator tests + parity
        run: make docs-test docs-parity

      - name: Example tests
        run: make examples-test
